<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор баннеров для LED-бортов</title>
    <link rel="icon" href="data:,">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .preview-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .preview-header h1 {
            color: #333;
            font-size: 24px;
        }

        .preview-wrapper {
            overflow-x: auto;
            background: #f8f9fa;
        }

        #preview {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .settings-section {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .settings-column h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
            border-bottom: 3px solid #007bff;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="number"],
        input[type="text"],
        input[type="color"],
        input[type="file"],
        select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus,
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
        }

        input[type="color"] {
            height: 45px;
            cursor: pointer;
        }

        select {
            cursor: pointer;
            background: white;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
        }

        .radio-group input[type="radio"] {
            width: auto;
            cursor: pointer;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:disabled { opacity: 0.5; cursor: wait; }

        button:hover {
            background: #0056b3;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover {
            background: #545b62;
        }

        button.danger {
            background: #dc3545;
            padding: 8px 16px;
            font-size: 13px;
        }

        button.danger:hover {
            background: #c82333;
        }

        button.duplicate {
            background: #ffc107;
            padding: 8px 16px;
            font-size: 13px;
            color: #000;
        }

        button.duplicate:hover {
            background: #e0a800;
        }

        button.success {
            background: #28a745;
            padding: 14px 28px;
            font-size: 16px;
        }

        button.success:hover {
            background: #218838;
        }

        button.add-block {
            width: 100%;
            margin-top: 10px;
            background: #17a2b8;
        }

        button.add-block:hover {
            background: #138496;
        }

        .text-block {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        .text-block:hover {
            border-color: #007bff;
        }

        .text-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #dee2e6;
        }

        .text-block-title {
            font-weight: 700;
            color: #333;
            font-size: 16px;
        }

        .text-block-actions {
            display: flex;
            gap: 8px;
        }

        .info {
            background: #e7f3ff;
            border-left: 4px solid #007bff;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #004085;
            border-radius: 4px;
        }

        .divisors {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .divisor-btn {
            padding: 8px 16px;
            background: #e9ecef;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            color: #333;
        }

        .divisor-btn:hover {
            background: #007bff;
            color: white;
            border-color: #007bff;
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
        }

        .divisor-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .text-blocks-container {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .text-blocks-container::-webkit-scrollbar {
            width: 8px;
        }

        .text-blocks-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .text-blocks-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .text-blocks-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        small {
            display: block;
            margin-top: 5px;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }

            .preview-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .button-group {
                flex-direction: column;
            }

            .button-group button {
                width: 100%;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Превью -->
        <div class="preview-section">
            <div class="preview-header">
                <h1>Превью баннера</h1>
                <div class="button-group" style="margin: 0;">
                    <button class="success" id="downloadButton" disabled onclick="downloadSVG()">📥 Скачать SVG</button>
                    <button class="secondary" onclick="updatePreview()">🔄 Обновить превью</button>
                </div>
            </div>
            <p id="assetStatus" role="status" style="margin-bottom: 12px; font-size: 14px;">Загружаем логотип и шрифт…</p>
            <div class="preview-wrapper">
                <svg id="preview" width="1000" height="96"></svg>
            </div>
        </div>

        <!-- Настройки -->
        <div class="settings-section">
            <div class="settings-grid">
                <!-- Колонка 1: Размеры и фон -->
                <div class="settings-column">
                    <h2>⚙️ Размеры борта</h2>

                    <div class="form-group">
                        <label>Общая длина LED-борта (px)</label>
                        <input type="number" id="totalLength" value="24960" min="100" step="100">
                    </div>

                    <div class="form-group">
                        <label>Высота борта (px)</label>
                        <input type="number" id="boardHeight" value="96" min="10" step="1">
                    </div>

                    <div class="form-group">
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="sectionMode" value="auto" checked>
                                Автоматически
                            </label>
                            <label>
                                <input type="radio" name="sectionMode" value="manual">
                                Вручную
                            </label>
                        </div>
                    </div>

                    <div class="form-group" id="divisorsContainer">
                        <label>Выберите длину секции (делители)</label>
                        <div class="divisors" id="divisorsList"></div>
                    </div>

                    <div class="form-group" id="manualSectionContainer" style="display: none;">
                        <label>Длина секции (px)</label>
                        <input type="number" id="sectionLength" value="2496" min="100" step="100">
                    </div>

                    <div class="info" id="sectionInfo"></div>

                    <h2 style="margin-top: 30px;">🎨 Фон</h2>

                    <div class="form-group">
                        <label>Цвет фона</label>
                        <input type="color" id="bgColor" value="#1a1a1a">
                    </div>
                </div>

                <!-- Колонка 2: Текстовые блоки -->
                <div class="settings-column">
                    <h2>📝 Блоки баннера</h2>

                    <div class="text-blocks-container" id="textBlocksContainer">
                        <div id="textBlocks"></div>
                    </div>

                    <button class="add-block" onclick="addTextBlock()">+ Добавить текстовый блок</button>
                    <button class="add-block" onclick="addLogoBlock()">+ Добавить логотип BETBOOM</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./vendor/opentype.min.js"></script>
    <script>
        let textBlocks = [];
        let customFonts = {};
        let loadedFonts = {};
        const defaultFonts = {
            ony: {
                name: 'ONY Track Compressed Black',
                path: './fonts/ONYTrack-CompressedBlack.otf',
                font: null
            }
        };
        const brandLogo = { width: 500, height: 118, paths: [] };
        let fontsLoaded = false;
        let nextBlockId = Date.now();

        async function loadDefaultFonts() {
            const response = await fetch(defaultFonts.ony.path);
            if (!response.ok) throw new Error('Не удалось загрузить ONY Track Compressed Black');
            const buffer = await response.arrayBuffer();
            defaultFonts.ony.font = opentype.parse(buffer);
            const face = new FontFace(defaultFonts.ony.name, buffer);
            document.fonts.add(await face.load());
            fontsLoaded = true;
        }

        async function loadBrandLogo() {
            const response = await fetch('./assets/bb_logo_for_background.svg');
            if (!response.ok) throw new Error('Не удалось загрузить логотип BETBOOM');
            const document = new DOMParser().parseFromString(await response.text(), 'image/svg+xml');
            if (document.querySelector('parsererror')) throw new Error('Не удалось прочитать SVG логотипа');
            brandLogo.paths = Array.from(document.querySelectorAll('path'), path => path.getAttribute('d'));
            if (!brandLogo.paths.length) throw new Error('В SVG логотипа нет контуров');
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', async function () {
            const status = document.getElementById('assetStatus');
            try {
                await Promise.all([loadDefaultFonts(), loadBrandLogo()]);
                initEventListeners();
                initDefaultBlocks();
                updateDivisors();
                updatePreview();
                status.textContent = 'BETBOOM · ONY Track Compressed Black · SVG в кривых';
                document.getElementById('downloadButton').disabled = false;
            } catch (error) {
                status.textContent = `${error.message}. Проверьте файлы проекта и обновите страницу.`;
                status.setAttribute('role', 'alert');
                console.error(error);
            }
        });

        function initEventListeners() {
            document.getElementById('totalLength').addEventListener('input', updateDivisors);
            document.getElementById('boardHeight').addEventListener('input', updatePreview);
            document.getElementById('bgColor').addEventListener('input', updatePreview);

            document.querySelectorAll('input[name="sectionMode"]').forEach(radio => {
                radio.addEventListener('change', function () {
                    if (this.value === 'manual') {
                        document.getElementById('divisorsContainer').style.display = 'none';
                        document.getElementById('manualSectionContainer').style.display = 'block';
                    } else {
                        document.getElementById('divisorsContainer').style.display = 'block';
                        document.getElementById('manualSectionContainer').style.display = 'none';
                    }
                    updatePreview();
                });
            });

            document.getElementById('sectionLength').addEventListener('input', updatePreview);
        }

        function initDefaultBlocks() {
            addLogoBlock();
            const id = ++nextBlockId;
            textBlocks.push({
                id,
                type: 'text',
                text: 'ФРИБЕТ ДО 10 000',
                fontSize: 138,
                color: '#ffffff',
                fontFamily: defaultFonts.ony.name,
                fontKey: 'ony',
                customFont: null,
                fontFile: null,
                verticalOffset: 5
            });
            loadedFonts[id] = defaultFonts.ony.font;
            renderTextBlocks();
        }

        function addLogoBlock() {
            textBlocks.push({
                id: ++nextBlockId,
                type: 'logo',
                fontSize: 96,
                color: '#ffffff',
                verticalOffset: 0
            });
            renderTextBlocks();
            updatePreview();
        }

        function findDivisors(num) {
            const divisors = [];
            for (let i = 1; i <= Math.sqrt(num); i++) {
                if (num % i === 0) {
                    divisors.push(i);
                    if (i !== num / i) {
                        divisors.push(num / i);
                    }
                }
            }
            return divisors.sort((a, b) => a - b);
        }

        function updateDivisors() {
            const totalLength = parseInt(document.getElementById('totalLength').value);
            const divisors = findDivisors(totalLength);
            const divisorsList = document.getElementById('divisorsList');
            const currentSectionLength = parseInt(document.getElementById('sectionLength').value);

            const filteredDivisors = divisors.filter(d => d >= 100 && d <= totalLength);

            divisorsList.innerHTML = '';
            filteredDivisors.forEach((divisor) => {
                const btn = document.createElement('button');
                btn.className = 'divisor-btn';
                btn.textContent = divisor;

                // Активируем кнопку если это текущая длина секции
                if (divisor === currentSectionLength) {
                    btn.classList.add('active');
                }

                btn.onclick = function () {
                    document.querySelectorAll('.divisor-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById('sectionLength').value = divisor;
                    updatePreview();
                };

                divisorsList.appendChild(btn);
            });

            updateSectionInfo();
            updatePreview();
        }

        function updateSectionInfo() {
            const totalLength = parseInt(document.getElementById('totalLength').value);
            const sectionLength = parseInt(document.getElementById('sectionLength').value);
            const sectionsCount = Math.floor(totalLength / sectionLength);

            document.getElementById('sectionInfo').textContent =
                `Секций: ${sectionsCount} × ${sectionLength}px = ${sectionsCount * sectionLength}px`;
        }

        function addTextBlock() {
            const id = ++nextBlockId;
            const block = {
                id: id,
                type: 'text',
                text: 'ТЕКСТ',
                fontSize: 60,
                color: '#ffffff',
                fontFamily: defaultFonts.ony.name,
                fontKey: 'ony',
                customFont: null,
                fontFile: null,
                verticalOffset: 0
            };

            // Сохраняем дефолтный шрифт
            if (defaultFonts.ony.font) {
                loadedFonts[id] = defaultFonts.ony.font;
            }

            textBlocks.push(block);
            renderTextBlocks();
            updatePreview();
        }

        function duplicateTextBlock(id) {
            const originalBlock = textBlocks.find(b => b.id === id);
            if (!originalBlock) return;

            const newId = ++nextBlockId;
            const duplicatedBlock = {
                ...originalBlock,
                id: newId
            };

            // Копируем загруженный шрифт
            if (loadedFonts[id]) {
                loadedFonts[newId] = loadedFonts[id];
            }

            textBlocks.push(duplicatedBlock);
            renderTextBlocks();
            updatePreview();
        }

        function removeTextBlock(id) {
            textBlocks = textBlocks.filter(block => block.id !== id);
            delete loadedFonts[id];
            delete customFonts[id];
            renderTextBlocks();
            updatePreview();
        }

        function updateTextBlock(id, field, value) {
            const block = textBlocks.find(b => b.id === id);
            if (block) {
                block[field] = value;
                updatePreview();
            }
        }

        function handleFontChange(id, fontKey) {
            const block = textBlocks.find(b => b.id === id);
            if (!block) return;

            if (fontKey === 'custom') {
                // Открываем диалог выбора файла
                const fileInput = document.getElementById(`fontFile_${id}`);
                if (fileInput) {
                    fileInput.click();
                }
            } else {
                // Используем дефолтный шрифт
                const font = defaultFonts[fontKey];
                if (font && font.font) {
                    block.fontFamily = font.name;
                    block.fontKey = fontKey;
                    block.customFont = null;
                    loadedFonts[id] = font.font;
                    renderTextBlocks();
                    updatePreview();
                }
            }
        }

        function handleFontUpload(id, file) {
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const font = opentype.parse(e.target.result);
                        loadedFonts[id] = font;

                        const fontName = 'CustomFont' + id;
                        const blob = new Blob([e.target.result], { type: 'font/otf' });
                        const url = URL.createObjectURL(blob);
                        const fontFace = new FontFace(fontName, `url(${url})`);

                        fontFace.load().then(function (loadedFont) {
                            document.fonts.add(loadedFont);
                            customFonts[id] = fontName;
                            updateTextBlock(id, 'fontFamily', fontName);
                            updateTextBlock(id, 'fontKey', 'custom');
                            updateTextBlock(id, 'customFont', file.name);
                            updateTextBlock(id, 'fontFile', file);
                            renderTextBlocks();
                        }).catch(function (error) {
                            console.error('Ошибка загрузки шрифта:', error);
                            alert('Не удалось загрузить шрифт для отображения');
                        });
                    } catch (error) {
                        console.error('Ошибка парсинга шрифта:', error);
                        alert('Не удалось прочитать файл шрифта');
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function renderTextBlocks() {
            const container = document.getElementById('textBlocks');
            container.innerHTML = '';

            textBlocks.forEach((block, index) => {
                const div = document.createElement('div');
                div.className = 'text-block';
                div.innerHTML = `
                    <div class="text-block-header">
                        <span class="text-block-title">${block.type === 'logo' ? 'Логотип' : 'Текст'} · Блок ${index + 1}</span>
                        <div class="text-block-actions">
                            <button class="duplicate" onclick="duplicateTextBlock(${block.id})">Дублировать</button>
                            <button class="danger" onclick="removeTextBlock(${block.id})">Удалить</button>
                        </div>
                    </div>

                    ${block.type === 'logo' ? '<p style="margin-bottom: 20px;">Векторный логотип BETBOOM. Пропорции сохраняются.</p>' : `
                    <div class="form-group">
                        <label for="blockText_${block.id}">Текст</label>
                        <input id="blockText_${block.id}" type="text" value="${escapeXml(block.text)}"
                               oninput="updateTextBlock(${block.id}, 'text', this.value)">
                    </div>`}

                    <div class="form-row">
                        <div class="form-group">
                            <label for="blockSize_${block.id}">${block.type === 'logo' ? 'Высота логотипа (px)' : 'Размер (px)'}</label>
                            <input id="blockSize_${block.id}" type="number" value="${block.fontSize}" min="10"
                                   oninput="updateTextBlock(${block.id}, 'fontSize', parseInt(this.value))">
                        </div>

                        <div class="form-group">
                            <label for="blockColor_${block.id}">Цвет</label>
                            <input id="blockColor_${block.id}" type="color" value="${block.color}"
                                   oninput="updateTextBlock(${block.id}, 'color', this.value)">
                        </div>

                        <div class="form-group">
                            <label for="blockOffset_${block.id}">Смещение (px)</label>
                            <input id="blockOffset_${block.id}" type="number" value="${block.verticalOffset}"
                                   oninput="updateTextBlock(${block.id}, 'verticalOffset', parseInt(this.value))">
                        </div>
                    </div>

                    ${block.type === 'logo' ? '' : `
                    <div class="form-group">
                        <label for="fontSelect_${block.id}">Шрифт</label>
                        <select onchange="handleFontChange(${block.id}, this.value)" id="fontSelect_${block.id}">
                            <option value="ony" ${block.fontKey === 'ony' ? 'selected' : ''}>ONY Track Compressed Black</option>
                            <option value="custom" ${block.fontKey === 'custom' ? 'selected' : ''}>Загрузить свой шрифт...</option>
                        </select>
                        <input type="file" id="fontFile_${block.id}" accept=".ttf,.otf,.woff,.woff2"
                               style="display: none;"
                               onchange="handleFontUpload(${block.id}, this.files[0])">
                        ${block.customFont ? `<small style="color: #28a745;">✓ ${escapeXml(block.customFont)}</small>` : ''}
                    </div>`}
                `;
                container.appendChild(div);
            });
        }

        function getPositionedBlocks(sectionLength) {
            if (!textBlocks.length) return [];
            const widths = textBlocks.map(block => block.type === 'logo'
                ? block.fontSize * brandLogo.width / brandLogo.height
                : loadedFonts[block.id].getAdvanceWidth(block.text, block.fontSize));
            const spacing = (sectionLength - widths.reduce((sum, width) => sum + width, 0)) / textBlocks.length;
            let currentX = spacing / 2;
            return textBlocks.map((block, index) => {
                const positioned = { ...block, x: currentX, width: widths[index] };
                currentX += widths[index] + spacing;
                return positioned;
            });
        }

        function getBlocksMarkup(blocks, height) {
            return blocks.map(block => {
                const y = height / 2 + block.verticalOffset;
                if (block.type === 'logo') {
                    const scale = block.fontSize / brandLogo.height;
                    return `<g data-block-type="logo" aria-label="BETBOOM" transform="translate(${block.x} ${y - block.fontSize / 2}) scale(${scale})" fill="${block.color}">${brandLogo.paths.map(d => `<path d="${escapeXml(d)}"/>`).join('')}</g>`;
                }
                const pathData = textToPath(loadedFonts[block.id], block.text, block.fontSize, block.x, y);
                return `<path data-block-type="text" d="${pathData}" fill="${block.color}"/>`;
            }).join('');
        }

        function updatePreview() {
            updateSectionInfo();
            const width = parseInt(document.getElementById('sectionLength').value);
            const height = parseInt(document.getElementById('boardHeight').value);
            const bgColor = document.getElementById('bgColor').value;
            renderSVG(width, height, bgColor, getPositionedBlocks(width));
        }

        function renderSVG(width, height, bgColor, blocks) {
            const svg = document.getElementById('preview');
            svg.setAttribute('width', width);
            svg.setAttribute('height', height);
            svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            // Кадрирование букв по высоте намеренное: текст заполняет LED-борт.
            svg.innerHTML = `<rect width="${width}" height="${height}" fill="${bgColor}"/>${getBlocksMarkup(blocks, height)}`;
        }

        function escapeXml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }

        function textToPath(font, text, fontSize, x, y) {
            // Создаем path с baseline в точке 0,0
            let path = font.getPath(text, 0, 0, fontSize);
            const bbox = path.getBoundingBox();

            // Находим визуальный центр path (середина между верхом и низом)
            const pathVisualCenter = (bbox.y1 + bbox.y2) / 2;

            // Смещаем path так, чтобы его визуальный центр был на y
            const adjustedY = y - pathVisualCenter;

            // Создаем финальный path с правильным смещением
            path = font.getPath(text, x, adjustedY, fontSize);
            return path.toPathData(2);
        }

        async function downloadSVG() {
            if (!fontsLoaded || !brandLogo.paths.length) return;
            const sectionLength = parseInt(document.getElementById('sectionLength').value);
            const height = parseInt(document.getElementById('boardHeight').value);
            const bgColor = document.getElementById('bgColor').value;
            // Превью и экспорт используют одни и те же векторные контуры.
            const svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${sectionLength}" height="${height}" viewBox="0 0 ${sectionLength} ${height}" xmlns="http://www.w3.org/2000/svg">
<rect width="${sectionLength}" height="${height}" fill="${bgColor}"/>${getBlocksMarkup(getPositionedBlocks(sectionLength), height)}</svg>`;

            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `led-banner-${sectionLength}x${height}.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
